# The Discord bot and Caddy (HTTPS for Discord's login return page).
# Settings come from .env (see .env.example), secrets from secrets.env (see secrets.env.example).
# install.sh writes both; docs/CONFIGURATION.md explains every setting.
services:
  bot:
    build: .
    image: valheim-discord-whitelist:local
    container_name: ${BOT_CONTAINER:-valheim-bot}
    restart: unless-stopped
    env_file: secrets.env                # DISCORD_TOKEN, DISCORD_CLIENT_SECRET (chmod 600)
    environment:
      TZ: ${TZ:-UTC}
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env}
      A2S_HOST: ${VALHEIM_HOST:-valheim}
      A2S_PORT: "2457"
      MAX_PLAYERS: ${MAX_PLAYERS:-10}
      JOIN_ADDRESS: ${JOIN_ADDRESS:?set JOIN_ADDRESS in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      WHITELIST_FILE: /whitelist/permittedlist.txt
      PROTECTED_STEAMIDS: ${PROTECTED_STEAMIDS:-}   # always whitelisted (the owner)
      ALLOWED_GUILDS: ${ALLOWED_GUILDS:?set ALLOWED_GUILDS in .env}   # everything is refused elsewhere
      NOTIFY_USER_ID: ${NOTIFY_USER_ID:-}   # Discord user who gets admin alert DMs
    volumes:
      - ${VALHEIM_DIR:?set VALHEIM_DIR in .env}/config/bot:/events:ro
      - ${VALHEIM_DIR}/config/worlds_local/${WORLD_NAME:?set WORLD_NAME in .env}:/world:ro
      # message of the day: a folder, not a single file, so editors that save by replacing the file still work
      - ./motd:/motd:ro
      - ./data:/data
      # the only writable game file: rewritten in place, writable via the valheim group
      - ${WHITELIST_HOST_FILE:-${VALHEIM_DIR}/config/permittedlist.txt}:/whitelist/permittedlist.txt
    group_add: ["${VALHEIM_GID:?set VALHEIM_GID in .env}"]
    networks: [valheim, web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    # unhealthy = no successful 30 s poll for 150 s (dashboard and session tracking stuck); see `docker ps`
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 150)"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  caddy:
    image: caddy:2.11
    container_name: ${CADDY_CONTAINER:-valheim-bot-caddy}
    profiles: [https]                    # enabled by COMPOSE_PROFILES=https in .env; a dev instance leaves it out
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}   # domain name or IP address
      BOT_CONTAINER: ${BOT_CONTAINER:-valheim-bot}
    volumes:
      - ${CADDYFILE:-./caddy/Caddyfile.domain}:/etc/caddy/Caddyfile:ro
      - ./caddy/common.caddy:/etc/caddy/common.caddy:ro
      - ./caddy/extra:/etc/caddy/extra:ro   # optional *.caddy snippets, e.g. the dev instance route
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks: [web]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

networks:
  web:
    name: ${WEB_NETWORK:-valheim-bot-web}
  valheim:
    name: ${VALHEIM_NETWORK:-valheim_default}
    external: true
